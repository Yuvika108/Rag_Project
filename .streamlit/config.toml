# Harvard Library & HOLLIS Digital Archives Theme for Streamlit
# Aesthetic: Harvard Crimson (#A51C30), Archival Vellum (#F9F8F6), Dark Oak (#1E1E1E) & Brass (#C5A059)

[theme]
base = "light"
primaryColor = "#A51C30"
backgroundColor = "#F9F8F6"
secondaryBackgroundColor = "#F3F1EC"
codeBackgroundColor = "#EDE8E0"
textColor = "#1C1D1F"
linkColor = "#A51C30"
borderColor = "#CDC7BC"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"

font = "'EB Garamond':https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
headingFont = "'Cinzel':https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.9rem"
codeTextColor = "#1C1D1F"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "27px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = true

chartCategoricalColors = ["#A51C30", "#C5A059", "#1E1E1E", "#3A506B", "#5C4A3A", "#861626", "#D8B573"]

# Harvard & Archival Palette
redColor = "#A51C30"
redBackgroundColor = "#FCECEE"
redTextColor = "#861626"

greenColor = "#1B4332"
greenBackgroundColor = "#E8F5E9"
greenTextColor = "#112D22"

yellowColor = "#C5A059"
yellowBackgroundColor = "#FDF7E7"
yellowTextColor = "#7C5D1F"

blueColor = "#1D3557"
blueBackgroundColor = "#EBF3FB"
blueTextColor = "#0F1E33"

grayColor = "#565961"
grayBackgroundColor = "#F0EFEA"
grayTextColor = "#1C1D1F"

dataframeBorderColor = "#CDC7BC"
dataframeHeaderBackgroundColor = "#EDE8E0"

[theme.sidebar]
backgroundColor = "#1E1E1E"
secondaryBackgroundColor = "#272727"
codeBackgroundColor = "#141414"
textColor = "#F7F7F5"
borderColor = "#3A3A3A"
primaryColor = "#A51C30"
dataframeHeaderBackgroundColor = "#272727"
dataframeBorderColor = "#3A3A3A"

[browser]
gatherUsageStats = false

[server]
headless = true
